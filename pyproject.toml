[project]
name = "apis-instance-viecpro"
version = "0.1.0"
description = "APIS Instance for the Project 'Der Wiener Hof. Ein prosopographisches Portal'"
authors = [{ name = "Birger Schacht", email = "birger.schacht@oeaw.ac.at"}, { name = "Matthias Schlögl", email = "matthias.schloegl@oeaw.ac.at" } ]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apis-core-rdf==0.67.2",
    "apis-acdhch-default-settings==2.20.0",
    "django-auditlog==3.4.1",
    "django-interval==0.5.4",
    "psycopg[binary]~=3.3",
    "mysqlclient>=2.2.8",
    "apis-bibsonomy>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff~=0.15",
]
