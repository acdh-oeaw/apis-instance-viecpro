{% extends "django_tables2/bootstrap5-responsive.html" %}
{% block pagination %}
    {{ block.super }}
    {% if table.page and table.paginator.num_pages > 1 %}
    <nav class="justify-content-center d-flex">
      <div class="input-group w-25">
        <div class="input-group-text">Go to page</div>
        <select class="form-control"
                id="goto"
                onchange="window.location.href=this.value;">
            {% for p in table.paginator.page_range %}
                <option value="{% querystring page=p %}"
                        {% if request.GET.page == p|stringformat:"d" %}selected="selected"{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>
      </div>
    </nav>
    {% endif %}
{% endblock pagination %}
